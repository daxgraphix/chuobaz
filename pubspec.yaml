name: chuobaz
description: "ChuoBaz - Africa's Campus Community Network"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Local storage / cache (no build_runner required)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Functional error handling
  dartz: ^0.10.1
  equatable: ^2.0.5
  collection: ^1.18.0

  # UI
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  timeago: ^3.7.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  pull_to_refresh_flutter3: ^2.0.2
  flutter_staggered_animations: ^1.1.1
  badges: ^3.1.2
  flutter_rating_bar: ^4.0.1

  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  flutter_local_notifications: ^17.2.1+2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
